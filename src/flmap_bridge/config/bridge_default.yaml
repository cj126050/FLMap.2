# flmap_bridge —— 边缘侧点云瘦身参数
#
# 目标：让 /cloud_registered（约 9.6 MB/s）变成 Wi-Fi 扛得住的流（约 3-6 Mbit/s）。
# 调参思路见 docs/bandwidth-tuning.md，这里只给结论。
#
# 注意：参数名必须和节点名完全一致（/flmap_bridge），否则 ROS 2 会静默不生效。

/flmap_bridge:
  ros__parameters:
    # ---- 输入 / 输出 ----
    input_topic: "/cloud_registered"      # FAST-LIO2 全分辨率配准点云（PointXYZINormal, 48 B/点）
    output_topic: "/flmap/cloud"          # 瘦身后发给 PC 的流（x,y,z,intensity, 16 B/点）

    # ---- 降采样 ----
    # 0.20 m 在室内是"看得清墙和家具、又足够省流量"的甜点。
    # 想更细腻 -> 0.15（流量约 +40%）；想更省 -> 0.30（流量约 -35%，墙面开始发糊）
    voxel_leaf: 0.20

    # 单帧点数硬上限，防止在开阔场地/室外突然爆量把链路打满。
    # 触顶时日志会打 [hit max_points cap]。
    max_points: 20000

    # ---- 限流 ----
    # 5 Hz 对建图过程的可视化完全够（LIO 本身 10 Hz）。
    # 链路紧张时可以降到 3 Hz，观感几乎无损。
    max_rate_hz: 5.0

    # 允许比目标周期早 15% 发布。
    # 输入帧间隔本来就不均匀（实测 0.05~0.36 s），严格按"间隔 >= 周期"判定会把
    # 大量帧丢掉 —— 目标 5 Hz 时实测只有 2.9 Hz。加容差后输出贴着目标频率走。
    # 一般不用改；设为 1.0 即恢复严格的固定间隔限流。
    rate_tolerance: 0.85

    # ---- 范围裁剪（单位 m，相对雷达）----
    # 太近的点是狗自身/云台遮挡，太远的点对室内建图没意义且最耗带宽。
    range_min: 0.5
    range_max: 40.0

    # 保留 intensity（FAST-LIO2 的 reflectivity）。关掉可以再省 25% 带宽，
    # 但 RViz 就只能按高度/单色着色。
    keep_intensity: true

    # 每隔多少帧打一行统计（帧数，不是秒）。0 = 关闭。
    stats_period: 60

    # ---- QoS ----
    # ⚠️ 必须两两成对匹配。实测 CycloneDDS：发布 RELIABLE + 订阅 BEST_EFFORT
    # 不是"降级"，而是**完全收不到数据**。
    # FAST-LIO2 的 /cloud_registered 默认 RELIABLE，所以输入侧必须 reliable；
    # 输出侧也用 reliable，才能被 RViz 的默认设置直接订阅到。
    # 链路极差时可以两边一起改 best_effort（RViz 显示项的 Reliability Policy 也要跟着改）。
    input_reliability: "reliable"
    output_reliability: "reliable"
